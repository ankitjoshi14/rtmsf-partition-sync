<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">RTMSF deployment architecture on Azure</title>
  <desc id="description">Planned Azure architecture: ADLS Gen2 emits committed file creation and deletion events through Event Grid into a Service Bus queue. Exactly one Azure Container Apps worker runs the existing routing, WOERA, and PMCP core through Azure adapters. It renews PeekLock deliveries, completes reconciled input, and uses native Service Bus dead-letter settlement for terminal input. PMCP reads authoritative storage and manages explicit external Parquet partition metadata through a Databricks SQL warehouse and Unity Catalog. Azure managed identity authorizes queue and storage access; Databricks OAuth machine-to-machine authorizes SQL access. The Unity Catalog access connector authorizes query reads from storage. Azure Container Registry supplies the cloud-built image and Azure Monitor retains logs. Only the SQL catalog proof has passed; the event pipeline, unattended authentication, and Azure worker have not yet been deployed or validated. Service symbols are generic, not official Microsoft icons.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526477"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0072B2"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#203142}
      .title{font-size:34px;font-weight:700}.sub{font-size:21px;fill:#526477}
      .name{font-size:24px;font-weight:700}.body{font-size:20px}.small{font-size:18px;fill:#526477}
      .service{fill:#fff;stroke:#c6d0da;stroke-width:2}.core{fill:#e8f4fa;stroke:#0072B2;stroke-width:2}
      .wire{fill:none;stroke:#526477;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#0072B2;stroke-width:3;marker-end:url(#blue-arrow)}
      .support{fill:none;stroke:#8999a8;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .icon{fill:none;stroke:#fff;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    </style>
