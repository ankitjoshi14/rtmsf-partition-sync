<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">RTMSF deployment architecture on GCP</title>
  <desc id="description">Cloud Storage sends native FINALIZE, DELETE and ARCHIVE notifications to Pub/Sub. One active finite RTMSF worker on a private Compute Engine VM runs Routing, WOERA and PMCP through GCP adapters. Routing reads existing owned Hive tables. PMCP checks generation and bounded storage listings, then adds or drops metadata partitions through the private Dataproc Metastore Thrift endpoint. The worker renews delivery leases and acknowledges successful reconciliation; terminal input requires confirmed quarantine publication before acknowledgment. A finite fixture producer and supervisor are lab support. A separate fresh Spark JVM on the VM queries the named Hive table and reads Parquet files independently of the worker. Ordinary VM service-account credentials grant cloud access; proof files preserve retries and actual process exits. All symbols are generic drawings, not official service icons.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526477"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0072B2"/></marker>
    <marker id="witness-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7550a5"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#203142}
      .title{font-size:34px;font-weight:700}.sub{font-size:21px;fill:#526477}
      .name{font-size:24px;font-weight:700}.body{font-size:20px}.small{font-size:18px;fill:#526477}
      .service{fill:#fff;stroke:#c6d0da;stroke-width:2}.core{fill:#e8f4fa;stroke:#0072B2;stroke-width:2}
      .wire{fill:none;stroke:#526477;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#0072B2;stroke-width:3;marker-end:url(#blue-arrow)}
      .support{fill:none;stroke:#8999a8;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .witness{fill:none;stroke:#7550a5;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#witness-arrow)}
      .icon{fill:none;stroke:#fff;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    </style>
  </defs>
