  <text x="173" y="840" class="name">Quarantine Queue</text>
  <text x="173" y="870" class="small">Invalid / terminal input before ACK</text>

  <rect x="625" y="215" width="540" height="705" rx="18" fill="#fff" stroke="#0072B2" stroke-width="2.5"/>
  <rect x="645" y="237" width="46" height="46" rx="7" fill="#0072B2"/>
  <path class="icon" d="M655 249h26v19h-26zM660 245v4M668 245v4M676 245v4M660 268v5M668 268v5M676 268v5"/>
  <text x="709" y="264" class="name">OCI Compute · RTMSF worker</text>
  <text x="650" y="306" class="small">1 OCPU · 2 GB RAM · instance principal</text>

  <text x="650" y="333" class="small">OCI adapters · unchanged core</text>

  <rect x="665" y="350" width="460" height="90" rx="11" class="core"/>
  <text x="895" y="386" class="name" text-anchor="middle">Routing</text>
  <text x="895" y="416" class="small" text-anchor="middle">Match exact object path to a configured table</text>
