<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">RTMSF validated integration with OCI</title>
  <desc id="description">OCI Object Storage emits create, update, and delete notifications through OCI Events. A Python Function bridge confirms publication to OCI Queue. One worker deployed on a 1 OCPU, 2 GB OCI Compute VM uses instance-principal authentication, OCI adapters and the unchanged routing, WOERA, and PMCP core. The worker renews pending Queue leases, acknowledges completed input, and copies invalid or terminal input to a separate quarantine queue before acknowledgement. PMCP performs authoritative Object Storage HEAD or bounded LIST calls and uses an in-memory catalog test double. External catalog integration is deferred and outside the tested OCI scope. Service symbols are generic, not official Oracle icons.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526477"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0072B2"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#203142}
      .title{font-size:34px;font-weight:700}.sub{font-size:21px;fill:#526477}
      .name{font-size:24px;font-weight:700}.body{font-size:20px}.small{font-size:18px;fill:#526477}
      .service{fill:#fff;stroke:#c6d0da;stroke-width:2}.core{fill:#e8f4fa;stroke:#0072B2;stroke-width:2}
      .wire{fill:none;stroke:#526477;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#0072B2;stroke-width:3;marker-end:url(#blue-arrow)}
      .planned{fill:none;stroke:#8999a8;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .icon{fill:none;stroke:#fff;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#fff"/>
  <text x="60" y="63" class="title">RTMSF validated integration with OCI</text>
  <text x="60" y="101" class="sub">OCI-hosted event delivery, worker, and storage checks · external catalog outside validation</text>

  <rect x="35" y="155" width="1190" height="765" rx="20" fill="#fafcfe" stroke="#c6d0da" stroke-width="2"/>
  <text x="60" y="190" class="small">OCI account / Region</text>
  <rect x="85" y="215" width="390" height="115" rx="14" class="service"/>
  <rect x="105" y="239" width="48" height="48" rx="7" fill="#C74634"/>
  <path class="icon" d="M114 251q15-8 30 0l-3 24q-12 7-24 0zM114 251q15 8 30 0M121 264h16"/>
  <text x="173" y="250" class="name">OCI Object Storage</text>
  <text x="173" y="280" class="body">Partitioned objects</text>
  <text x="173" y="309" class="small">Authoritative current state</text>
  <path class="wire" d="M280 330V365"/>

  <rect x="85" y="365" width="390" height="100" rx="14" class="service"/>
  <rect x="105" y="388" width="48" height="48" rx="7" fill="#C74634"/>
