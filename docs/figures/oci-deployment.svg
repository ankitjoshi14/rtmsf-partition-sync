  <text x="173" y="399" class="name">OCI Events</text>
  <text x="173" y="429" class="body">Rule filtered to the test bucket</text>
  <text x="173" y="455" class="small">Create / update / delete</text>
  <path class="wire" d="M280 465V500"/>

  <rect x="85" y="500" width="390" height="110" rx="14" class="service"/>
  <rect x="105" y="525" width="48" height="48" rx="7" fill="#C74634"/>
  <path class="icon" d="M120 535l-7 14 7 14M138 535l7 14-7 14M132 536l-6 26"/>
  <text x="173" y="536" class="name">OCI Functions</text>
  <text x="173" y="566" class="body">Python event bridge</text>
  <text x="173" y="596" class="small">Confirm Queue publication</text>
  <path class="wire" d="M280 610V645"/>

  <rect x="85" y="645" width="390" height="110" rx="14" class="service"/>
  <rect x="105" y="670" width="48" height="48" rx="7" fill="#C74634"/>
