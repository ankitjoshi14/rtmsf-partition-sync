  <rect x="665" y="495" width="460" height="90" rx="11" class="core"/>
  <text x="895" y="531" class="name" text-anchor="middle">WOERA</text>
  <text x="895" y="561" class="small" text-anchor="middle">Group partition events within Q / T_max</text>
  <path class="flow" d="M895 585V640"/>
  <rect x="665" y="640" width="460" height="100" rx="11" class="core"/>
  <text x="895" y="676" class="name" text-anchor="middle">PMCP</text>
  <text x="895" y="706" class="small" text-anchor="middle">Verify storage and reconcile partition membership</text>
  <path class="wire" d="M895 740V790"/>
  <rect x="665" y="790" width="460" height="70" rx="11" class="service"/>
  <text x="895" y="820" class="name" text-anchor="middle">In-memory catalog</text>
  <text x="895" y="848" class="small" text-anchor="middle">Validation test double only</text>
  <text x="665" y="768" class="small">Renew pending leases</text>
  <text x="1125" y="768" class="small" text-anchor="end">ACK completed input</text>
  <text x="650" y="897" class="small">VM trace: buffer → reconcile → acknowledge</text>

  <path class="wire" d="M475 690H585V386H665"/>
  <text x="590" y="367" class="small">Receive</text>
  <path class="wire" d="M625 765H540V730H475"/>
  <path class="wire" d="M625 845H475"/>
  <path class="wire" d="M1125 660H1195V135H280V215"/>
  <text x="790" y="126" class="small" text-anchor="middle">Authoritative Object Storage HEAD / bounded LIST</text>

  <rect x="1270" y="535" width="280" height="245" rx="14" fill="#fafafa" stroke="#8999a8" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="1387" y="555" width="46" height="46" rx="7" fill="#8999a8"/>
  <path class="icon" d="M1396 567q14-7 28 0v22q-14 8-28 0zM1396 567q14 8 28 0M1396 578q14 8 28 0"/>
  <text x="1410" y="638" class="name" text-anchor="middle">External catalog</text>
  <text x="1410" y="676" class="small" text-anchor="middle">Outside tested OCI scope</text>
  <text x="1410" y="714" class="body" text-anchor="middle">Catalog adapter deferred</text>
  <text x="1410" y="754" class="small" text-anchor="middle">No real catalog / query test</text>
  <path class="planned" d="M1125 705H1270"/>
  <text x="1197" y="695" class="small" text-anchor="middle">Future adapter</text>

  <text x="60" y="963" class="small">Solid: tested runtime path · dashed: catalog integration outside validation</text>
  <text x="60" y="989" class="small">Service symbols are generic; OCI names identify the actual services used.</text>
</svg>
