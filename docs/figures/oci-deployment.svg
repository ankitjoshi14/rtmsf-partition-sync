  <text x="173" y="710" class="body">Pending event notifications</text>
  <text x="173" y="740" class="small">Receipts and visibility leases</text>

  <rect x="85" y="805" width="390" height="85" rx="14" class="service"/>
  <rect x="105" y="824" width="48" height="48" rx="7" fill="#C74634"/>
