[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtmsf-partition-sync"
version = "0.2.0"
description = "Provider-neutral real-time metadata synchronization"
requires-python = ">=3.12"
authors = [{name = "Ankit Joshi"}]
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.34,<2"]
oci = ["oci==2.187.2", "fdk==0.1.126"]
experiment = ["boto3>=1.34,<2", "pyarrow>=17,<22", "matplotlib>=3.9,<4"]
dev = ["pytest>=8,<9", "boto3>=1.34,<2", "pyarrow>=17,<22", "PyYAML>=6,<7", "matplotlib>=3.9,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"experiments.aws" = ["template.yaml"]
